<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Top Binder Clips -->
  <g id="clips">
    <!-- Left Clip -->
    <rect x="156" y="44" width="36" height="74" rx="14" fill="#05070B" />
    <path d="M156 58C156 50.268 162.268 44 170 44H178C185.732 44 192 50.268 192 58V72H156V58Z" fill="#0F172A" />
    <rect x="164" y="52" width="20" height="24" rx="6" fill="#3B82F6" fill-opacity="0.3" />

    <!-- Right Clip -->
    <rect x="320" y="44" width="36" height="74" rx="14" fill="#05070B" />
    <path d="M320 58C320 50.268 326.268 44 334 44H342C349.732 44 356 50.268 356 58V72H320V58Z" fill="#0F172A" />
    <rect x="328" y="52" width="20" height="24" rx="6" fill="#3B82F6" fill-opacity="0.3" />
  </g>

  <!-- Main Calendar Board Body -->
  <rect x="74" y="80" width="364" height="364" rx="64" fill="#3B82F6" />

  <!-- Inner White Content Card -->
  <rect x="116" y="132" width="280" height="260" rx="36" fill="#FFFFFF" />

  <!-- Scheduled Subscription Rows -->
  <!-- Row 1: Green Active Dot + Bar -->
  <circle cx="160" cy="186" r="18" fill="#22C55E" />
  <rect x="194" y="174" width="168" height="24" rx="12" fill="#D8DCE3" />

  <!-- Row 2: Red Urgent Dot + Bar -->
  <circle cx="160" cy="248" r="18" fill="#EF4444" />
  <rect x="194" y="236" width="162" height="24" rx="12" fill="#D8DCE3" />

  <!-- Row 3: Blue Upcoming Dot + Bar -->
  <circle cx="160" cy="310" r="18" fill="#3B82F6" />
  <rect x="194" y="298" width="142" height="24" rx="12" fill="#D8DCE3" />

  <!-- Bottom-Right Floating Rupee Badge -->
  <g id="rupee-badge">
    <!-- Blue Badge Circle with Subtle Outline -->
    <circle cx="410" cy="386" r="68" fill="#2563EB" stroke="#0A0F1D" stroke-width="2.5" />

    <!-- Indian Rupee Symbol (₹) in Crisp Vector White -->
    <path d="M386 352H434M386 368H434M386 352V400M404 352C422 352 430 360 430 374C430 388 418 394 402 395L434 424" 
          stroke="#FFFFFF" 
          stroke-width="7" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>
