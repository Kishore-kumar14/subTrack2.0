<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <!-- Main Blue Board -->
  <rect x="40" y="50" width="160" height="160" rx="24" fill="#4A89F3" />
  
  <!-- Binders (Placed behind the white board but over the blue board) -->
  <rect x="74" y="30" width="20" height="36" rx="10" fill="#111111" stroke="#E5E7EB" stroke-width="3" />
  <rect x="146" y="30" width="20" height="36" rx="10" fill="#111111" stroke="#E5E7EB" stroke-width="3" />

  <!-- Inner White Board -->
  <rect x="56" y="80" width="128" height="114" rx="16" fill="#FFFFFF" />

  <!-- List Item 1: Green -->
  <circle cx="80" cy="106" r="9" fill="#4ADE80" />
  <rect x="100" y="100" width="68" height="12" rx="6" fill="#D1D5DB" />

  <!-- List Item 2: Red -->
  <circle cx="80" cy="136" r="9" fill="#EF4444" />
  <rect x="100" y="130" width="68" height="12" rx="6" fill="#D1D5DB" />

  <!-- List Item 3: Blue -->
  <circle cx="80" cy="166" r="9" fill="#4A89F3" />
  <rect x="100" y="160" width="68" height="12" rx="6" fill="#D1D5DB" />

  <!-- Rupee Badge (Bottom Right) -->
  <circle cx="196" cy="186" r="34" fill="#4A89F3" stroke="#111111" stroke-width="1.5" />
  
  <!-- Rupee Text Symbol -->
  <text 
    x="196" 
    y="189" 
    fill="#FFFFFF" 
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
    font-weight="800" 
    font-size="38" 
    text-anchor="middle" 
    dominant-baseline="central">₹</text>
</svg>
